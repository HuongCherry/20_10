<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bức thư dành cho bạn 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Khu vực phong bì thư */
        .envelope-container {
            position: relative;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .envelope-container:hover {
            transform: scale(1.05);
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: #ff4757;
            position: relative;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* Nắp phong bì */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #e84118;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 3;
        }

        /* Khi mở phong bì: lật nắp lên */
        .envelope.open::before {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-flap-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            z-index: 4;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Giao diện bức thư bên trong phong bì */
        #letter-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            width: 320px;
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 2;
        }

        #letter-content.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
            z-index: 5;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: #ff4757;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }

        /* Hiệu ứng hoa rơi */
        .falling-flower {
            position: absolute;
            top: -10%;
            font-size: 24px;
            animation: fall linear infinite;
            z-index: 0;
            user-select: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <!-- Phong bì thư bấm vào để mở -->
    <div class="envelope-container" id="envelopeBox" onclick="openEnvelope()">
        <div class="envelope" id="envelopeElem">
            <div class="envelope-flap-text">Chạm để mở thư 💌</div>
        </div>
    </div>

    <!-- Bức thư chứa lời chúc hiện ra khi mở phong bì -->
    <div id="letter-content">
        <h1>Gửi Người Đặc Biệt!</h1>
        <p>Chúc bạn một ngày thật tuyệt vời, ngập tràn niềm vui, luôn xinh đẹp và gặp nhiều may mắn trên con đường phía trước nhé! 💖🌷✨</p>
    </div>

    <script>
        function openEnvelope() {
            const envelopeElem = document.getElementById('envelopeElem');
            const envelopeBox = document.getElementById('envelopeBox');
            const letterContent = document.getElementById('letter-content');

            // Mở nắp phong bì
            envelopeElem.classList.add('open');

            // Sau một khoảnh khắc ngắn, ẩn phong bì và trượt thư ra
            setTimeout(() => {
                envelopeBox.style.display = 'none';
                letterContent.classList.add('show');
                createFallingFlowers();
            }, 500);
        }

        function createFallingFlowers() {
            const flowers = ['🌸', '🌷', '🌺', '💖', '✨'];
            setInterval(() => {
                const flower = document.createElement('div');
                flower.classList.add('falling-flower');
                flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
                flower.style.left = Math.random() * 100 + 'vw';
                flower.style.animationDuration = (Math.random() * 3 + 2) + 's';
                flower.style.fontSize = (Math.random() * 20 + 15) + 'px';
                
                document.body.appendChild(flower);

                setTimeout(() => {
                    flower.remove();
                }, 5000);
            }, 300);
        }
    </script>
</body>
</html>
