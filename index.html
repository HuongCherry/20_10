

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phong bì yêu thương 💌</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;overflow:hidden;
  display:flex;justify-content:center;align-items:center;
  font-family:Georgia,serif;
  background:radial-gradient(circle,#6f456e,#25162f 80%);
}
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-40px;animation:fall linear infinite}
@keyframes fall{
  to{transform:translate3d(70px,110vh,0) rotate(720deg)}
}
.scene{
  width:min(88vw,370px);height:440px;
  position:relative;perspective:1000px;
}
.title{
  position:absolute;top:0;width:100%;text-align:center;
  color:#ffe2ee;font-size:25px;line-height:1.5;
  text-shadow:0 2px 15px #ff8ab5;
}
.hint{font-size:14px;color:#fbd9e8}
.envelope{
  position:absolute;left:0;bottom:45px;width:100%;height:220px;
  cursor:pointer;filter:drop-shadow(0 18px 20px #12081988);
}
.env-back{
  position:absolute;inset:0;
  background:#e9a6c2;border-radius:5px;
}
.letter{
  position:absolute;z-index:2;left:5%;bottom:12px;
  width:90%;height:195px;padding:18px 15px;
  text-align:center;color:#973c63;
  background:linear-gradient(145deg,#fffaf7,#ffe5ee);
  border-radius:8px;overflow:auto;
  transition:transform 1.3s cubic-bezier(.2,.8,.2,1),
             height 1s,opacity .5s;
  box-shadow:0 0 12px #7c315322;
}
.letter h2{font-size:25px;margin:5px 0 12px}
.letter p{font-size:16px;line-height:1.65;white-space:pre-line}
.letter .rose{font-size:32px}
.flap{
  position:absolute;z-index:5;left:0;top:0;width:100%;height:120px;
  background:#f7bfd4;clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .8s ease;
}
.pocket{
  position:absolute;z-index:4;inset:0;
  background:#d979a4;
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);
}
.pocket:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,#f3b4cf,#c75e8d);
  clip-path:polygon(0 100%,0 0,50% 55%,100% 0,100% 100%);
}
.seal{
  position:absolute;z-index:7;left:50%;top:98px;
  transform:translateX(-50%);
  width:49px;height:49px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffedf4,#bd376d);
  display:grid;place-items:center;font-size:25px;
  box-shadow:0 3px 9px #77203c77;
  transition:opacity .3s;
}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.envelope.open .seal{opacity:0;pointer-events:none}
.envelope.open .letter{
  height:365px;transform:translateY(-115px);
  z-index:6;overflow:auto;
}
.envelope.open .pocket{z-index:4}
.envelope.open{cursor:default}
.envelope.open .letter{box-shadow:0 0 30px #ffb7d777}
.opened-message{display:none}
.envelope.open .opened-message{display:block}
.envelope.open .front-message{display:none}
.front-message{
  position:absolute;z-index:8;bottom:18px;width:100%;
  text-align:center;color:white;font-size:17px;
  pointer-events:none;text-shadow:0 1px 4px #793653;
}
.actions{
  position:absolute;bottom:0;width:100%;text-align:center;
}
button{
  border:1px solid #ffcade;border-radius:30px;padding:10px 20px;
  background:#fff0f6;color:#9c3765;cursor:pointer;font-size:15px;
}
</style>
</head>
<body>
<div id="petals"></div>

<div class="scene">
  <div class="title">
    💗 Gửi tặng bạn 💗
    <div class="hint" id="hint">Chạm vào phong bì để mở nhé!</div>
  </div>

  <div class="envelope" id="env" onclick="openEnvelope()">
    <div class="env-back"></div>

    <div class="letter" id="letter">
      <div class="front-message">💌 Một món quà nhỏ</div>
      <div class="opened-message">
        <div class="rose">🌹🌸🌹</div>
        <h2>Chúc bạn luôn hạnh phúc!</h2>
        <p id="wish">Chúc bạn mỗi ngày đều ngập tràn niềm vui, luôn bình an, mạnh khoẻ và gặp nhiều điều tốt đẹp💖</p>
          <p id="wish">Mong mọi ước mơ của bạn đều trở thành hiện thực</p>
        <div class="rose">💐💗💐</div>
      </div>
    </div>

    <div class="flap"></div>
    <div class="pocket"></div>
    <div class="seal">❤</div>
  </div>

  <div class="actions">
    <button onclick="resetEnvelope(event)">↻ Đóng phong bì</button>
  </div>
</div>

<script>
const env=document.getElementById('env');
let opened=false;

function openEnvelope(){
  if(opened)return;
  opened=true;
  env.classList.add('open');
  document.getElementById('hint').textContent='Một lời chúc dành riêng cho bạn 💕';
}
function resetEnvelope(e){
  e.stopPropagation();
  opened=false;
  env.classList.remove('open');
  document.getElementById('hint').textContent='Chạm vào phong bì để mở nhé!';
}

const area=document.getElementById('petals');
const flowers=['🌸','🌷','🌹','💮','💕','🌺'];
for(let i=0;i<35;i++){
  const p=document.createElement('span');
  p.className='petal';
  p.textContent=flowers[Math.floor(Math.random()*flowers.length)];
  p.style.left=Math.random()*100+'%';
  p.style.fontSize=(13+Math.random()*16)+'px';
  p.style.animationDuration=(6+Math.random()*10)+'s';
  p.style.animationDelay=(-Math.random()*15)+'s';
  area.appendChild(p);
}
</script>
</body>
</html>
